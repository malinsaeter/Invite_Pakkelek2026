<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ✏️ TEKST FOR LENKE-FORHÅNDSVISNING (fanen, Messenger, Snapchat, SMS) -->
  <title>Grøtfest &amp; pakkelek</title>
  <meta name="description" content="Du er herved invitert til grøtfest og pakkelek – enogtyvende desember kl. 19.00. Same procedure as every year.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Grøtfest &amp; pakkelek">
  <meta property="og:description" content="Du er herved invitert! Enogtyvende desember kl. 19.00 – same procedure as every year.">
  <!-- Forhåndsvisningstjenester krever full URL til bildet, derfor er disse to absolutte. -->
  <meta property="og:url" content="https://malinsaeter.github.io/Invite_Pakkelek2026/">
  <meta property="og:image" content="https://malinsaeter.github.io/Invite_Pakkelek2026/assets/ref-3-kort.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="Blondekort med invitasjon til grøtfest og pakkelek">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#3d0006">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/kort.png" as="image">
  <link rel="stylesheet" href="style.css">
  <noscript><style>.envelope,.tagline{display:none}.card{visibility:visible}</style></noscript>
</head>
<body>
  <main class="scene" id="scene">

    <!-- ✏️ ALL TEKST PÅ SIDEN – endre her ================================== -->

    <p class="tagline" id="tagline">same procedure as every year...</p>

    <article class="card" id="card" tabindex="-1" aria-label="Invitasjon">
      <img class="card-bg" src="assets/kort.png" alt="" width="622" height="951">
      <div class="card-text">
        <p class="intro">Du er herved invitert til</p>
        <h1 class="title">
          <span>Grøtfest</span>
          <span>&amp; pakkelek</span>
        </h1>
        <hr class="rule">
        <p class="details">
          <span>Enogtyvende desember</span>
          <span>kl. 19.00</span>
          <span>Hos meg</span>
        </p>
        <p class="signoff">same procedure as every year</p>
      </div>
    </article>

    <!-- Teksten på konvolutten ligger i .tap-label og aria-label på knappen under. -->
    <!-- ==================================================================== -->

    <div class="envelope" id="envelope">
      <div class="env-glow" aria-hidden="true"></div>

      <svg class="env-back" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="g-back" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3e0810"/>
            <stop offset=".5" stop-color="#57101a"/>
            <stop offset="1" stop-color="#5e121c"/>
          </linearGradient>
        </defs>
        <rect width="400" height="300" fill="url(#g-back)"/>
      </svg>

      <div class="env-floor" aria-hidden="true"></div>

      <svg class="env-front" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="g-side-l" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6a1520"/>
            <stop offset="1" stop-color="#5a101a"/>
          </linearGradient>
          <linearGradient id="g-side-r" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="#6a1520"/>
            <stop offset="1" stop-color="#5a101a"/>
          </linearGradient>
          <linearGradient id="g-bottom" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#741826"/>
            <stop offset="1" stop-color="#5c111b"/>
          </linearGradient>
        </defs>
        <path d="M0 0 L200 150 L400 0 L400 300 L0 300 Z" fill="#5e121c"/>
        <path d="M0 0 L200 150 L0 300 Z" fill="url(#g-side-l)"/>
        <path d="M400 0 L200 150 L400 300 Z" fill="url(#g-side-r)"/>
        <path d="M0 300 L200 166 L400 300 Z" fill="url(#g-bottom)"/>
        <path d="M0 300 L200 166 L400 300" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>
        <path d="M2 298 L200 168.5 L398 298" fill="none" stroke="rgba(255,220,220,.07)" stroke-width="1"/>
      </svg>

      <div class="flap" id="flap" aria-hidden="true">
        <div class="flap-face flap-outer">
          <svg viewBox="0 0 400 240" preserveAspectRatio="none">
          <defs>
            <linearGradient id="g-flap" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#781a27"/>
              <stop offset="1" stop-color="#651320"/>
            </linearGradient>
            <clipPath id="flap-clip"><rect x="0" y="-20" width="400" height="270"/></clipPath>
          </defs>
          <g class="lace" clip-path="url(#flap-clip)" data-fill="#5c101a" data-dot="#3a070e" data-hi="rgba(255,200,200,.14)"></g>
          <path d="M0 0 L400 0 L200 202 Z" fill="url(#g-flap)"/>
          <path d="M8 0 L200 193 L392 0" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.1" stroke-dasharray="3 2.5"/>
          <path d="M0 .5 L200 202 L400 .5" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/>
          </svg>
          <span class="tap-label">tap to open</span>
        </div>
        <svg class="flap-face flap-inner" viewBox="0 0 400 240" preserveAspectRatio="none">
          <g class="lace" clip-path="url(#flap-clip)" data-fill="#4d0c15" data-dot="#33060c" data-hi="rgba(255,200,200,.08)"></g>
          <path d="M0 0 L400 0 L200 202 Z" fill="#53101a"/>
        </svg>
      </div>

      <button class="opener" id="opener" type="button" aria-label="Åpne invitasjonen"></button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
